server.port=8080

# Keep Instants readable (ISO-8601) in JSON responses
spring.jackson.serialization.write-dates-as-timestamps=false

# Keep startup logs tidy
logging.level.com.insight=INFO

# ---- PostgreSQL datasource ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/insight}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# dialect auto-detected by Hibernate for PostgreSQL
spring.jpa.open-in-view=false